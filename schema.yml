components:
  schemas:
    AccountabilityPartner:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        partner:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AccountabilityPartnerStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - partner
      - requester
      - status
    AccountabilityPartnerRequest:
      type: object
      properties:
        partner_id:
          type: integer
          writeOnly: true
      required:
      - partner_id
    AccountabilityPartnerStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
    LimitedTeam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    LimitedTeamRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    LimitedUser:
      type: object
      description: A lightweight serializer for user info to avoid circular imports.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      - id
    LimitedUserRequest:
      type: object
      description: A lightweight serializer for user info to avoid circular imports.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/LimitedUser'
          readOnly: true
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - joined_at
      - organization
      - user
    MembershipRequest:
      type: object
      properties:
        user_id:
          type: integer
          writeOnly: true
        organization_id:
          type: integer
          writeOnly: true
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
      required:
      - organization_id
      - user_id
    MembershipRoleEnum:
      enum:
      - admin
      - manager
      - employee
      type: string
      description: |-
        * `admin` - Admin
        * `manager` - Manager
        * `employee` - Employee
    Organization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        logo:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
          readOnly: true
        stripe_customer_id:
          type: string
          readOnly: true
        is_premium:
          type: boolean
          readOnly: true
        is_on_trial:
          type: boolean
          readOnly: true
        trial_ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - is_on_trial
      - is_premium
      - name
      - stripe_customer_id
      - trial_ends_at
    OrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        logo:
          type: string
          format: binary
      required:
      - name
    PasswordResetConfirm:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    PasswordResetConfirmRequest:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - token
      - uid
    PatchedAccountabilityPartnerRequest:
      type: object
      properties:
        partner_id:
          type: integer
          writeOnly: true
    PatchedMembershipRequest:
      type: object
      properties:
        user_id:
          type: integer
          writeOnly: true
        organization_id:
          type: integer
          writeOnly: true
